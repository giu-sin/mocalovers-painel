(function(){var v=view('evolucao');var chCards='';DE.forEach(function(d,i){var ch=(DL.ch||[]).find(function(x){return x.id===d.id;});if(ch)chCards+='<div class="card"><h3>'+d.title.replace('Desafio de Agosto: ','').slice(0,22)+'</h3><div class="psub">Aprovados/dia</div><div class="chartbox sm"><canvas id="evch'+i+'"></canvas></div></div>';});
 v.innerHTML='<div class="card" style="margin-bottom:16px;"><h3>Inscrições por dia</h3><div class="psub">Novos cadastros desde '+DL.su.s+' (linha branca = média de 7 dias)</div><div class="chartbox"><canvas id="evsu"></canvas></div></div><div class="grid g2">'+chCards+'</div>';
})();
// ---- GALERIA ----
(function(){var v=view('galeria');var h='<div style="margin-bottom:14px;"><h2 style="font-size:20px;">Galeria de <span class="g" style="background:var(--grad-gold);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;">conteúdos</span></h2><div class="brandsub">Amostra dos posts aprovados, por desafio</div></div>';
 GA.forEach(function(g){h+='<h3 style="margin:16px 0 10px;font-family:Sora;">'+g.t.replace('Desafio de Agosto: ','')+'</h3><div class="gal">';(g.posts||[]).forEach(function(p){var ig=(p.ig||'').replace(/^@/,'');var fmt=p.prov==='tiktok'?'TikTok':(p.ct==='story'?'Story':(p.ct==='reels'?'Reels':'Post'));var ic=p.prov==='tiktok'?'🎵':(p.ct==='story'?'📸':'🎬');h+='<a class="gcard" href="'+(p.link||'#')+'" target="_blank" rel="noopener"><div class="ic">'+ic+'</div><div class="cn">'+(p.name||'-')+'</div>'+(ig?'<div class="cu">@'+ig+'</div>':'')+'<div class="cf">'+fmt+' · ver post ↗</div></a>';});h+='</div>';});
 v.innerHTML=h;
})();
// ---- DRAW CHARTS (lazy) ----
function draw(id){
 if(id==='cadastros'){donut('c_donut',['Aprovadas','Aguardando','Incompletos','Pendentes'],[D.aprovados,D.aguardando,D.incompletos,D.pendentes],[GREEN,AMBER,VIOLET,'rgba(255,255,255,.18)']);}
 else if(id.indexOf('des')===0){var i=+id.slice(3);var d=DE[i];var ch=(DL.ch||[]).find(function(x){return x.id===d.id;});donut('dmix'+i,['Reels','TikTok','Stories','Outros'],[d.reels,d.tiktok,d.stories,d.outros],[GREEN,AMBER,BLUE,'rgba(255,255,255,.18)']);ring('dring'+i,d.aprovados,d.submissoes);if(ch)area('dday'+i,labels(ch.s,ch.apr.length),ch.apr,GREEN,'aprovados/dia');}
 else if(id==='comparativo'){mk('cmp',{type:'bar',data:{labels:DE.map(function(d){return d.title.replace('Desafio de Agosto: ','').slice(0,18);}),datasets:[{label:'Criadoras',data:DE.map(function(d){return d.participantes;}),backgroundColor:GOLD,borderRadius:6},{label:'Aprovados',data:DE.map(function(d){return d.aprovados;}),backgroundColor:BLUE,borderRadius:6}]},options:{plugins:{legend:{labels:{color:'#9aa6c0'}}},scales:{x:{grid:{display:false}},y:{grid:{color:'rgba(255,255,255,.06)'}}}}});}
 else if(id==='evolucao'){area('evsu',labels(DL.su.s,DL.su.c.length),DL.su.c,BLUE,'cadastros/dia');DE.forEach(function(d,i){var ch=(DL.ch||[]).find(function(x){return x.id===d.id;});if(ch)area('evch'+i,labels(ch.s,ch.apr.length),ch.apr,GREEN,'aprovados/dia');});}
}
window.__activate=activate;
function activate(id){[].forEach.call(nav.querySelectorAll('.tab'),function(b){b.classList.toggle('active',b.dataset.view===id);});[].forEach.call(main.querySelectorAll('.view'),function(v){v.hidden=(v.id!=='v_'+id);});if(!built[id]){built[id]=true;setTimeout(function(){draw(id);},30);}}
activate('cadastros');
})();

</script>
