<style>
:root{
  --bg:#070a12; --bg2:#0a0f1c; --panel:rgba(255,255,255,.045); --panel2:rgba(255,255,255,.028);
  --br:rgba(255,255,255,.09); --br2:rgba(255,255,255,.06);
  --ink:#eef2fb; --sub:#96a2bd; --dim:#69748f;
  --gold:#e7c66b; --gold2:#caa64d; --blue:#6aa8ff; --violet:#a98bff; --green:#3ddc9a; --red:#ff6d6d; --amber:#ffbd5a;
  --grad-gold:linear-gradient(135deg,#f4d987,#c79b3f);
  --grad-blue:linear-gradient(135deg,#8ec0ff,#5a86ff);
  --grad-green:linear-gradient(135deg,#6ef0bf,#2bbf85);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--ink);
  line-height:1.5;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(900px 600px at 12% -8%,rgba(231,198,107,.10),transparent 60%),
    radial-gradient(1000px 700px at 100% 0%,rgba(106,168,255,.10),transparent 55%),
    var(--bg);
}
.wrap{max-width:1240px;margin:0 auto;padding:26px 22px 80px}
.ey{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700}
h3{font-family:'Sora',sans-serif;font-size:16px;font-weight:700;letter-spacing:-.2px}
.psub{font-size:12.5px;color:var(--sub);margin-top:2px}
.mut{color:var(--sub)}
.card{border:1px solid var(--br);border-radius:18px;padding:20px;background:var(--panel);backdrop-filter:blur(6px)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.brand{font-family:'Sora',sans-serif;font-weight:800;font-size:30px;letter-spacing:-.5px}
.brand b{background:var(--grad-gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font-size:13px;color:var(--sub);margin-top:4px}
.stamp{text-align:right;font-size:12px;color:var(--sub);line-height:1.6}
.stamp b{color:var(--ink)}
.live{display:inline-flex;align-items:center;gap:6px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(61,220,154,.6);animation:pl 2s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(61,220,154,.5)}70%{box-shadow:0 0 0 7px rgba(61,220,154,0)}100%{box-shadow:0 0 0 0 rgba(61,220,154,0)}}

/* hero exec */
.hero{border:1px solid var(--br);border-radius:20px;padding:22px 24px;margin-bottom:18px;
  background:linear-gradient(180deg,rgba(231,198,107,.06),rgba(255,255,255,.02));}
.hero .ey{color:var(--gold)}
.hero p{font-size:16.5px;line-height:1.72;margin-top:10px;color:#dfe6f4;max-width:1000px}
.hero p b{color:#fff;font-weight:800}
.hl{border-bottom:1px dashed rgba(255,255,255,.22)}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:22px}
@media(max-width:1050px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.kpis{grid-template-columns:1fr}}
.kpi{position:relative;border:1px solid var(--br);border-radius:18px;padding:18px 18px 16px;background:var(--panel);overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;height:100%;width:4px;background:var(--ac,var(--gold))}
.kpi .kl{font-size:12px;color:var(--sub);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .kv{font-family:'Sora',sans-serif;font-size:33px;font-weight:800;letter-spacing:-1px;margin-top:8px;line-height:1}
.kpi .ks{font-size:12px;color:var(--dim);margin-top:8px}
.kpi .kb{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;margin-top:9px}
.kb.up{color:var(--green);background:rgba(61,220,154,.12)}
.kb.dn{color:var(--red);background:rgba(255,109,109,.12)}
.kb.nt{color:var(--sub);background:rgba(255,255,255,.06)}

/* nav */
.nav{display:flex;gap:8px;overflow-x:auto;padding:5px;margin-bottom:20px;border:1px solid var(--br);border-radius:14px;background:var(--panel2);scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;border:0;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:700;color:var(--sub);
  padding:9px 15px;border-radius:10px;background:transparent;transition:.15s}
.tab:hover{color:var(--ink)}
.tab.on{color:#1a1205;background:var(--grad-gold);box-shadow:0 4px 16px rgba(231,198,107,.25)}
.view{animation:fx .25s ease}
@keyframes fx{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* stat */
.stat{border:1px solid var(--br2);border-radius:14px;padding:14px 15px;background:var(--panel2)}
.stat .n{font-family:'Sora',sans-serif;font-size:23px;font-weight:800;letter-spacing:-.5px;line-height:1}
.stat .l{font-size:11.5px;color:var(--sub);margin-top:6px;font-weight:600}
.stat .h{font-size:11px;color:var(--dim);margin-top:3px}
.gold{color:var(--gold)} .cblue{color:var(--blue)} .cgreen{color:var(--green)} .cred{color:var(--red)} .camber{color:var(--amber)} .cviolet{color:var(--violet)}

/* funnel */
.fnl{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.frow{display:flex;align-items:center;gap:14px}
.fbar{height:46px;border-radius:11px;display:flex;align-items:center;padding:0 16px;min-width:120px;
  font-family:'Sora',sans-serif;font-weight:800;font-size:18px;color:#0c1220;position:relative}
.fmeta{font-size:12.5px;color:var(--sub);flex:1}
.fmeta b{color:var(--ink);font-weight:700}
.fconv{font-size:12px;color:var(--dim)}

/* goal */
.goal{margin-top:4px}
.gbar{height:20px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden;position:relative;border:1px solid var(--br2)}
.gfill{height:100%;background:var(--grad-green);border-radius:999px}
.gtop{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px}
.gbig{font-family:'Sora',sans-serif;font-size:26px;font-weight:800}

/* chart boxes */
.chartbox{height:230px;margin-top:12px;position:relative}
.chartbox.sm{height:180px}
.chartbox.lg{height:300px}
.ring{width:150px;height:150px;position:relative;flex:0 0 auto}
.ring .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .rp{font-family:'Sora',sans-serif;font-size:26px;font-weight:800}
.ring .rs{font-size:10.5px;color:var(--sub)}

/* legend / meaning */
.mean{margin-top:14px;border-top:1px solid var(--br2);padding-top:12px;display:grid;gap:5px;font-size:12.5px;color:var(--sub);line-height:1.6}
.mean b{color:var(--ink)}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:middle}

/* challenge card */
.chal{border:1px solid var(--br);border-radius:18px;padding:20px;background:var(--panel);margin-bottom:16px}
.chead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.cttl{font-family:'Sora',sans-serif;font-weight:800;font-size:19px}
.cmeta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cper{font-size:12.5px;color:var(--sub)}
.pill{font-size:11px;font-weight:800;padding:4px 11px;border-radius:999px;border:1px solid var(--br)}
.pill.ok{color:var(--green);background:rgba(61,220,154,.12);border-color:rgba(61,220,154,.3)}
.pill.off{color:var(--sub)}
.pill.soon{color:var(--amber);background:rgba(255,189,90,.12);border-color:rgba(255,189,90,.3)}

/* comparativo */
.cmpwrap{overflow-x:auto}
.cmpt{width:100%;border-collapse:separate;border-spacing:0;min-width:560px}
.cmpt th,.cmpt td{padding:14px 14px;text-align:left;border-bottom:1px solid var(--br2)}
.cmpt thead th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--sub);font-weight:700}
.cmpt tbody th{font-weight:700;font-size:13.5px}
.cmpt tbody th .mm{display:block;font-weight:500;font-size:11.5px;color:var(--dim);margin-top:2px}
.cmpt .val{font-family:'Sora',sans-serif;font-weight:800;font-size:20px;letter-spacing:-.5px}
.cmpt .sub{font-size:11px;color:var(--dim);margin-top:2px}
.cmpt tbody tr:last-child td,.cmpt tbody tr:last-child th{border-bottom:0}

/* ranking */
.rank{list-style:none;display:grid;gap:8px}
.ritem{display:flex;align-items:center;gap:14px;border:1px solid var(--br2);border-radius:14px;padding:11px 14px;background:var(--panel2)}
.pos{font-family:'Sora',sans-serif;font-weight:800;font-size:15px;width:30px;text-align:center;color:var(--gold);flex:0 0 auto}
.av{width:42px;height:42px;border-radius:50%;object-fit:cover;background:rgba(255,255,255,.08);flex:0 0 auto;border:1px solid var(--br)}
.nm{flex:1;min-width:0}
.n1{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n2{font-size:12px;color:var(--sub)}
.ct{font-family:'Sora',sans-serif;font-weight:800;font-size:18px}
.ct span{font-size:11px;color:var(--sub);font-weight:600}
.rlink{color:var(--blue);text-decoration:none;font-size:12px;font-weight:700;flex:0 0 auto}

/* gallery */
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:700px){.gal{grid-template-columns:1fr 1fr}}
.gcard{border:1px solid var(--br2);border-radius:14px;padding:13px;background:var(--panel2);display:block;text-decoration:none;color:inherit;transition:.15s}
.gcard:hover{border-color:var(--gold);transform:translateY(-2px)}
.gtop2{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.gav{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.08);flex:0 0 auto}
.gname{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gfmt{font-size:11px;color:var(--sub)}
.gopen{font-size:12px;color:var(--blue);font-weight:700}

/* insight */
.insight{border:1px solid var(--br);border-radius:16px;padding:16px 18px;background:linear-gradient(180deg,rgba(106,168,255,.06),rgba(255,255,255,.02));margin-top:16px}
.insight .h{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--blue);font-weight:700;margin-bottom:8px}
.insight ul{margin:0;padding-left:18px;display:grid;gap:5px}
.insight li{font-size:13.5px;color:#d5deee;line-height:1.6}

.sechead{margin-bottom:14px}
.spacer{height:16px}
.tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
@media(max-width:640px){.tiers{grid-template-columns:1fr 1fr}}
</style>

          '<div class="ring"><canvas id="ring'+d.id+'"></canvas><div class="rc"><div class="rp cgreen">'+taxa+'%</div><div class="rs">aprovação</div></div></div>'+
          '<div style="flex:1;min-width:140px;font-size:13.5px;line-height:2">'+
            '<div><span class="dot" style="background:#3ddc9a"></span>Aprovados <b>'+br(d.aprovados)+'</b></div>'+
            '<div><span class="dot" style="background:#ff6d6d"></span>Reprovados <b>'+br(d.reprovados)+'</b></div>'+
            '<div class="mut" style="font-size:12px;margin-top:6px">A cada 100 posts, '+taxa+' foram aprovados.</div>'+
          '</div></div>'+
        '</div>'+
      '</div>'+
    '</div>';
  });
  v.innerHTML=html;
})();

/* ---------- COMPARATIVO ---------- */
(function(){
  var v=view('comparativo');
  function col(d){return '<td><div class="val cgreen">'+br(d.aprovados)+'</div></td>';}
  var heads='<th></th>'+DE.map(function(d){return '<th>'+nm(d.title)+'</th>';}).join('');
  function row(lbl,mm,cls,fn){
    return '<tr><th>'+lbl+'<span class="mm">'+mm+'</span></th>'+
      DE.map(function(d){var r=fn(d);return '<td><div class="val '+cls+'">'+r[0]+'</div>'+(r[1]?'<div class="sub">'+r[1]+'</div>':'')+'</td>';}).join('')+'</tr>';
  }
  var table='<div class="cmpwrap"><table class="cmpt"><thead><tr>'+heads+'</tr></thead><tbody>'+
    row('Criadoras','pessoas diferentes que publicaram','gold',function(d){return [br(d.participantes)];})+
    row('Conteúdos enviados','posts submetidos','',function(d){return [br(d.submissoes)];})+
    row('Aprovados','passaram na curadoria','cgreen',function(d){return [br(d.aprovados)];})+
    row('Reprovados','barrados na curadoria','cred',function(d){return [br(d.reprovados)];})+
    row('Taxa de aprovação','aprovados ÷ enviados','cblue',function(d){return [pct(d.aprovados,d.submissoes)+'%'];})+
    '</tbody></table></div>';
  v.innerHTML=
    '<div class="card" style="margin-bottom:16px"><div class="sechead"><h3>Comparativo dos desafios</h3><div class="psub">Participação e conteúdo aprovado por desafio</div></div><div class="chartbox"><canvas id="cmp"></canvas></div></div>'+
    '<div class="card"><div class="sechead"><h3>Desempenho lado a lado</h3><div class="psub">Os mesmos números, com o significado de cada linha</div></div>'+
      table+
      '<div class="mean"><div><b>Taxa de aprovação</b> — de cada 100 posts enviados, quantos foram aprovados. Ex.: 96% = 96 aprovados e 4 reprovados a cada 100.</div>'+
      '<div><b>Criadoras</b> conta pessoas diferentes; uma pessoa pode enviar vários conteúdos.</div></div>'+
    '</div>'+
    insight('Como ler',['Compare Criadoras para ver qual desafio mobilizou mais gente.','Taxa de aprovação alta = conteúdo já vem no padrão, menos curadoria.']);
})();

/* ---------- EVOLUÇÃO ---------- */
(function(){
  var v=view('evolucao');
  v.innerHTML=
    '<div class="card" style="margin-bottom:16px"><div class="sechead"><h3>Cadastros por dia</h3><div class="psub">Desde 15/06 · linha suave = média de 7 dias</div></div><div class="chartbox lg"><canvas id="evsu"></canvas></div>'+
      '<div class="mean"><div>Entraram <b>'+br(sum(DL.su.c))+'</b> cadastros no total · <b>'+br(novos7)+'</b> nos últimos 7 dias.</div></div>'+
    '</div>'+
    '<div class="card"><div class="sechead"><h3>Novas criadoras por desafio</h3><div class="psub">Quando cada desafio trouxe gente nova para publicar</div></div><div class="chartbox lg"><canvas id="evnov"></canvas></div></div>';
})();

/* ---------- RANKING ---------- */
(function(){
  var v=view('ranking');
  var items=TP.slice(0,20).map(function(c,i){
    var prof=c.ig?('https://instagram.com/'+encodeURIComponent(c.ig)):null;
    var av=c.photo?'<img class="av" src="'+c.photo+'" onerror="this.style.visibility=\'hidden\'">':'<div class="av"></div>';
    var handle=c.ig?('@'+c.ig):(c.tk?('TikTok @'+c.tk):'');
    return '<li class="ritem"><div class="pos">'+(i+1)+'</div>'+av+
      '<div class="nm"><div class="n1">'+(c.name||c.nick||'—')+'</div><div class="n2">'+handle+'</div></div>'+
      '<div class="ct">'+br(c.count)+' <span>aprov.</span></div>'+
      (prof?'<a class="rlink" href="'+prof+'" target="_blank" rel="noopener">ver</a>':'')+'</li>';
  }).join('');
  v.innerHTML='<div class="card"><div class="sechead"><h3>Top criadoras por conteúdo aprovado</h3><div class="psub">As que mais entregaram posts aprovados no período</div></div><ul class="rank">'+items+'</ul></div>';
})();

/* ---------- GALERIA ---------- */
(function(){
  var v=view('galeria');
  var html='';
  GA.forEach(function(g){
    var cards=(g.posts||[]).map(function(p){
      var prov=p.prov==='tiktok'?'TikTok':'Instagram';
      var fmt=(p.ct||'').replace('reels','Reels').replace('story','Story').replace('video','Vídeo').replace('photo','Foto');
      return '<a class="gcard" href="'+p.link+'" target="_blank" rel="noopener"><div class="gtop2"><div class="gav"></div><div style="min-width:0"><div class="gname">'+(p.name||'—')+'</div><div class="gfmt">'+prov+' · '+fmt+'</div></div></div><div class="gopen">Abrir post ↗</div></a>';
    }).join('');
    html+='<div class="card" style="margin-bottom:16px"><div class="sechead"><h3>'+nm(g.t)+'</h3><div class="psub">Conteúdos aprovados mais recentes</div></div><div class="gal">'+cards+'</div></div>';
  });
  v.innerHTML=html;
})();

/* ---------- DRAW CHARTS (lazy) ---------- */
function draw(id){
  if(built[id])return;built[id]=true;
  if(id==='overview'){donut('ovd',['Aprovadas','Aguardando','Incompletos','Pendentes','Outros'],[D.aprovados,D.aguardando,D.incompletos,D.pendentes,Math.max(0,D.total-D.aprovados-D.aguardando-D.incompletos-D.pendentes)],['#3ddc9a','#e7c66b','#a98bff','#6aa8ff','rgba(255,255,255,.14)']);}
  if(id==='negocio'){var e=CO.emv;mk('emv',{type:'bar',data:{labels:['Stories','Reels','TikTok','Outros'],datasets:[{label:'Valor (R$)',data:[e.story*e.rates.story,e.reels*e.rates.reels,e.tiktok*e.rates.tiktok,e.outros*e.rates.outros],backgroundColor:['#e7c66b','#6aa8ff','#a98bff','#3ddc9a'],borderRadius:8}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:GC,y:Object.assign({},GC,{ticks:{color:'#69748f',font:{size:11},callback:function(val){return 'R$ '+(val/1e6).toFixed(1)+'mi';}}})}}});}
  if(id==='desafios'){DE.forEach(function(d){donut('mix'+d.id,['Stories','Reels','TikTok','Outros'],[d.stories,d.reels,d.tiktok,d.outros],['#e7c66b','#6aa8ff','#a98bff','#3ddc9a']);ringc('ring'+d.id,d.aprovados,d.reprovados);});}
  if(id==='comparativo'){mk('cmp',{type:'bar',data:{labels:DE.map(function(d){return nm(d.title);}),datasets:[{label:'Criadoras',data:DE.map(function(d){return d.participantes;}),backgroundColor:'#e7c66b',borderRadius:7},{label:'Aprovados',data:DE.map(function(d){return d.aprovados;}),backgroundColor:'#6aa8ff',borderRadius:7}]},options:{maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{x:GC,y:GC}}});}
  if(id==='evolucao'){
    var labs=DL.su.c.map(function(_,i){return i;});
    function ma(a,w){var o=[];for(var i=0;i<a.length;i++){var s=0,c=0;for(var j=Math.max(0,i-w+1);j<=i;j++){s+=a[j];c++;}o.push(Math.round(s/c));}return o;}
    mk('evsu',{type:'line',data:{labels:labs,datasets:[{label:'Cadastros/dia',data:DL.su.c,borderColor:'rgba(231,198,107,.35)',backgroundColor:'rgba(231,198,107,.10)',fill:true,pointRadius:0,tension:.3},{label:'Média 7 dias',data:ma(DL.su.c,7),borderColor:'#e7c66b',borderWidth:2.5,pointRadius:0,tension:.3}]},options:{maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{x:Object.assign({},GC,{ticks:{display:false}}),y:GC}}});
    var ds=DE.map(function(d,i){var ch=DL.ch.find(function(c){return c.id===d.id;});return {label:nm(d.title),data:ch?ch.nov:[],borderColor:[ '#e7c66b','#6aa8ff','#a98bff'][i%3],backgroundColor:'transparent',borderWidth:2.5,pointRadius:0,tension:.3};});
    var maxlen=Math.max.apply(null,DL.ch.map(function(c){return c.nov.length;}));
    mk('evnov',{type:'line',data:{labels:Array.from({length:maxlen},function(_,i){return i;}),datasets:ds},options:{maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{x:Object.assign({},GC,{ticks:{display:false}}),y:GC}}});
  }
}

/* ---------- TAB LOGIC ---------- */
function activate(id){
  TABS.forEach(function(t){var el=document.getElementById('v-'+t[0]);if(el)el.hidden=(t[0]!==id);});
  nav.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('on',b.dataset.v===id);});
  requestAnimationFrame(function(){draw(id);});
}
nav.addEventListener('click',function(e){var b=e.target.closest('.tab');if(b)activate(b.dataset.v);});
activate('overview');
})();

</script>
</body>
